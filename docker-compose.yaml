version: '3.8'

services:
  user-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chouse-user
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://users-db:5432/chouse_users
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  users-db:
    image: postgres:17-alpine
    container_name: chouse-users-db
    environment:
      POSTGRES_DB: chouse_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chouse_users"]
      interval: 5s
      timeout: 3s
      retries: 10
