name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify --file pom.xml



    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: "rafaelvlf"
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: rafaelvlf/chouse-user:${{ github.sha }}


    - name: executing remote ssh commands using password
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_TEST }}
        username: "ubuntu"
        key: ${{ secrets.KEY_TEST }}
        port: 22
        script: |
          docker network create chouse-net 2>/dev/null || true
          docker stop chouse-user 2>/dev/null || true
          docker rm --force chouse-user 2>/dev/null || true
          docker run -d \
            --name chouse-user \
            --network chouse-net \
            --restart unless-stopped \
            -p 8082:8080 \
            -e DATABASE_URL=jdbc:postgresql://chouse-users-db:5432/chouse_users \
            -e DATABASE_USERNAME=postgres \
            -e DATABASE_PASSWORD=postgres \
            rafaelvlf/chouse-user:${{ github.sha }}